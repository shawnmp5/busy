<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronos Calendar</title>
<meta name="description" content="A calendar with sticky notes for every day, reminders, and themes you can make your own.">
<link rel="icon" type="image/svg+xml" href="assets/logo/chronos-favicon.svg">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
<meta name="theme-color" content="#040a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&family=Caveat:wght@500..700&family=Cinzel:wght@600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>

<!--APP-->
<div class="ambient" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="app" id="app">
  <header class="topbar">
    <div class="tb-left">

        <span class="brand-name">Chronos</span>
      </div>
      <button class="btn ghost" id="btn-today">Today</button>
      <div class="nav-arrows">
        <button class="icon-btn" id="btn-prev" aria-label="Previous" title="Previous (←)"><svg class="ic"><use href="#i-left"/></svg></button>
        <button class="icon-btn" id="btn-next" aria-label="Next" title="Next (→)"><svg class="ic"><use href="#i-right"/></svg></button>
      </div>
      <h1 class="view-title" id="view-title" aria-live="polite"></h1>
    </div>
    <div class="tb-right">
      <div class="search" id="search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="Search events & notes" autocomplete="off" aria-label="Search events and notes">
        <kbd>/</kbd>
        <div class="search-results" id="search-results" hidden></div>
      </div>
      <div class="seg" id="view-seg" role="tablist" aria-label="View">
        <button data-view="day" role="tab">Day</button>
        <button data-view="week" role="tab">Week</button>
        <button data-view="month" role="tab">Month</button>
        <button data-view="year" role="tab">Year</button>
      </div>
      <button class="icon-btn has-badge" id="btn-bell" aria-label="Reminders" title="Reminders"><svg class="ic"><use href="#i-bell"/></svg><span class="badge" id="bell-badge" hidden>0</span></button>
      <button class="icon-btn" id="btn-settings" aria-label="Customize" title="Customize"><svg class="ic"><use href="#i-sliders"/></svg></button>
      <button class="icon-btn" id="btn-board" aria-label="Toggle day board" title="Day board (B)"><svg class="ic"><use href="#i-panel"/></svg></button>
    </div>
  </header>

  <aside class="sidebar panel" id="sidebar">
    <div class="create-row">
      <button class="btn primary create" id="btn-create"><svg class="ic"><use href="#i-plus"/></svg>New event</button>
      <button class="btn note-btn" id="btn-create-note" title="New sticky note (N)"><svg class="ic"><use href="#i-sticky"/></svg><span>Note</span></button>
    </div>
    <section class="now-card" id="now-card"></section>
    <section class="mini" id="mini"></section>
    <section class="side-sec">
      <div class="side-head"><h2>Up next</h2></div>
      <ul class="upnext" id="upnext"></ul>
    </section>
    <section class="side-sec">
      <div class="side-head"><h2>Calendars</h2><button class="icon-btn sm" id="btn-add-cal" aria-label="Add calendar" title="Add calendar"><svg class="ic"><use href="#i-plus"/></svg></button></div>
      <ul class="cal-list" id="cal-list"></ul>
    </section>
    <button class="shortcut-hint" id="btn-shortcuts"><svg class="ic"><use href="#i-keyboard"/></svg>Keyboard shortcuts <kbd>?</kbd></button>
  </aside>

  <main class="stage panel" id="stage"></main>

  <aside class="board panel" id="board" aria-label="Day board"></aside>
</div>

<div class="scrim" id="scrim" hidden></div>
<div id="layer"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

</svg>

<script src="js/app.js"></script>
<!--/APP-->
</body>
</html>
